# Fair Split: co-op payroll. Render Blueprint (https://render.com/docs/blueprint-spec).
# Checked against https://render.com/schema/render.yaml.json and Fair Split's deployment rules
# (tools/lib/blueprint.ts) by apps/tasks/test/render-blueprint.test.ts and by
# `corepack pnpm exec tsx tools/lint-render.ts` (CI's render.yaml lint, S3.17).
#
# Approved S3.3, S3.13 and S3.14, as revised on 31 Oct (decision D6). Three resources in one region:
# `virginia`, not the default `oregon` (Render's outbound IPs are shared per region, so the region does not
# protect the PayPal throttle).
#   fs-api    web, always on: API, SSE, webhooks, the console, /app, /media, the outbox dispatcher and every
#             task inline (EXECUTOR=inline), including those the hourly tick enqueues. There is no fs-tasks
#             (Render Workflows) service: Judge Mode replays the reads, so no task needs one.
#   fs-cron   a thin trigger at :07 UTC that POSTs fs-api's /internal/cron/tick over the private network.
#   fs-db     Postgres 18.
# Every service follows `main` with automatic deploys off: each deploy is a manual one, made between judging
# sessions (the simulator's state resets with the process).
#
# Secrets (S3.13). No environment group: Render ignores `sync: false` keys inside groups. Each service declares
# only what it needs, under the names fs-api's env.ts reads. Render prompts once, when the Blueprint is
# created, for exactly the `sync: false` keys: FS_LINK_SIGNING_KEY and FS_LEDGER_SIGNING_KEY (two different
# 32-byte Ed25519 seeds in lowercase hex), FS_OPERATOR_PASSWORD_SCRYPT (`node tools/ops-hash-password.mjs`),
# JUDGE_CODE_SHA256 (optional) and FS_KILL (left blank). FS_COOKIE_SECRET, CRON_SECRET and FS_APP_DB_PASSWORD
# are `generateValue` on fs-api; fs-cron gets CRON_SECRET through `fromService … envVarKey`. The runbook is
# apps/tasks/README.md, "Deploying".
#
# Database roles (S3.4, register §7: the app role cannot UPDATE or DELETE run_events, ledger_entries or
# agent_sessions; ADR-0005).
#   - Only fs-api holds the owner's URL, and only as DATABASE_OWNER_URL: `@fairsplit/db migrate`
#     (preDeployCommand) reads it, and on Render never DATABASE_URL. Migrate creates fs_app with LOGIN, or
#     resets its password, from FS_APP_DB_PASSWORD (generated below), so the first deploy needs no manual step.
#   - No service declares DATABASE_URL. fs-api's entry builds fs_app's from DATABASE_OWNER_URL's host, port and
#     database plus FS_APP_DB_PASSWORD (`useAppDatabaseUrl`, packages/db/src/cli/app-url.ts), deletes both from
#     process.env, and refuses to start if its role can UPDATE ledger_entries. The value still sits in fs-api's
#     initial environment (/proc/<pid>/environ), a residual risk ADR-0005 records; fs-db therefore accepts no
#     external connection at all. fs-cron has no database access at all.
#
# PayPal rail (ADR-0002). PP_MODE=simulator runs PayPal's REST subset on the contract-faithful simulator, and
# every PayPal-derived value is labelled "Simulated PayPal sandbox". The PP_* values below are the simulator's
# own committed, fictional ones (packages/paypal-sim/data/accounts.json: the fs-judge app, the co-op, Lantern
# Bay, seven member receivers and Rhea's address with no account); only the simulator accepts them, they are
# not PayPal credentials, and the policy checks each against that file. PP_MODE=sandbox is untested: it needs
# the real sandbox app's values as `sync: false` keys in place of these (tools/lib/blueprint.ts).
#
# Kill switch (S3.11). `system_flags` (per workspace, read fresh at every task entry, flipped from /ops) is the
# runtime authority. FS_KILL is the deploy-wide override, `sync: false` so that a Blueprint sync never resets it.
version: "1"

services:
  - type: web
    name: fs-api
    runtime: node
    region: virginia
    branch: main
    # Paid instance: never spins down, keeps SSE and the LISTEN connection alive (register §6).
    plan: 0.5c-512mb
    numInstances: 1
    # The /app export runs in its labelled demo mode: no EXPO_PUBLIC_API_ORIGIN until the phone talks to fs-api.
    # assemble-media copies the allowlisted /media files (never media/ wholesale) into STATIC_MEDIA_DIR. The last
    # step fails the build if a secret value, or a PayPal, Anthropic or Render key prefix, reached any
    # apps/*/dist file, the assembled media included (S3.13).
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm turbo run build --filter=@fairsplit/api... --filter=@fairsplit/console --filter=@fairsplit/mobile &&
      corepack pnpm exec tsx tools/assemble-media.ts &&
      corepack pnpm exec tsx tools/scan-dist.ts
    preDeployCommand: corepack pnpm --filter @fairsplit/db migrate
    # Bound V8 to the 512 MB instance rather than the development host's RAM. Leave native/SSE headroom.
    startCommand: node --max-old-space-size=192 --max-semi-space-size=8 apps/api/dist/index.js
    # Liveness only. /readyz depends on PayPal token scope and webhook registration; failing the
    # platform health check on a PayPal outage would restart a healthy process and block deploys.
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: "off"
    buildFilter:
      paths:
        - apps/api/**
        - apps/console/**
        - apps/mobile/**
        - packages/**
        - media/**
        - assets/**
        - tools/assemble-media.ts
        - tools/scan-dist.ts
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
      # Tests and READMEs only. Never `**/*.md`: the prompts (packages/ai/src/*/prompts/*.md) are
      # runtime input, so a prompt-only commit must redeploy (checkIgnoredPaths in tools/lib/blueprint.ts).
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/test/**"
        - "**/README.md"
        - packages/eval/**
        - packages/test-kit/**
    envVars:
      # The repo pin (CI and docs/versions.md). tools/lib/blueprint.ts enforces it.
      - key: NODE_VERSION
        value: "24.19.0"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: TZ
        value: UTC
      - key: LOG_LEVEL
        value: info
      - key: PP_ENV
        value: sandbox
      - key: PP_MODE
        value: simulator
      - key: EXECUTOR
        value: inline
      - key: STATIC_MEDIA_DIR
        value: apps/api/dist/media
      # The owner's URL, for migrate only. fs-api's entry builds fs_app's DATABASE_URL and deletes this
      # from process.env; /proc/<pid>/environ keeps it (ADR-0005), hence fs-db's empty ipAllowList.
      - key: DATABASE_OWNER_URL
        fromDatabase:
          name: fs-db
          property: connectionString
      - key: FS_APP_DB_PASSWORD
        generateValue: true
      # HMAC root for cookies and IP hashing; fs-api needs 32+ characters, and Render's value is a base64 256 bits.
      - key: FS_COOKIE_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # The simulator's fs-judge app and seeded accounts (fake, committed; see the header).
      - key: PP_CLIENT_ID
        value: SIM-fs-judge-client
      - key: PP_CLIENT_SECRET
        value: sim-fs-judge-not-a-paypal-secret
      - key: PP_BUSINESS_EMAIL
        value: bulawanon.coop@example.org
      - key: PP_PAYER_EMAIL
        value: lantern.bay.payables@example.org
      - key: PP_RECEIVERS
        value: M-002=florencia.ybanez@example.org,M-007=dionisio.lapinig@example.org,M-014=consolacion.bacus@example.org,M-018=teodoro.pacana@example.org,M-022=pedro.ompad@example.org,M-039=jonathan.ripalda@example.org,M-060=arnel.sumampao@example.org
      - key: PP_UNCLAIMED_RECEIVER
        value: rhea.jumawan@example.org
      # Prompted once at creation. Two different Ed25519 seeds, 64 lowercase hex each: member and brand links,
      # and the ledger checkpoints Proof verifies. fs-api refuses to boot on Render with either one blank.
      - key: FS_LINK_SIGNING_KEY
        sync: false
      - key: FS_LEDGER_SIGNING_KEY
        sync: false
      # `node tools/ops-hash-password.mjs`: the scrypt hash of the /ops password, never the password. Required
      # on Render too: left blank, fs-api refuses to boot rather than deploy an /ops no one can sign in to.
      - key: FS_OPERATOR_PASSWORD_SCRYPT
        sync: false
      # Optional: the sha256 of the judge code that unlocks the judge-code bucket (runbook one-liner).
      - key: JUDGE_CODE_SHA256
        sync: false
      - key: FS_KILL
        sync: false

  - type: cron
    name: fs-cron
    runtime: node
    region: virginia
    branch: main
    plan: 0.5c-512mb
    # Minute 7 of every hour, UTC (register §6). Must equal CRON_SCHEDULE in apps/tasks/src/cron.ts.
    schedule: "7 * * * *"
    # Nothing to build: the trigger is one dependency-free script.
    buildCommand: "true"
    startCommand: node tools/cron-tick.mjs
    autoDeployTrigger: "off"
    buildFilter:
      paths:
        - tools/cron-tick.mjs
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: FS_API_HOSTPORT
        fromService:
          type: web
          name: fs-api
          property: hostport
      - key: CRON_SECRET
        fromService:
          type: web
          name: fs-api
          envVarKey: CRON_SECRET

databases:
  - name: fs-db
    region: virginia
    # Smallest paid Postgres; the free tier expires before the December judging window.
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: fairsplit
    user: fairsplit
    # No external connections: "To block all external connections, set ipAllowList to an empty list"
    # (render.com/docs/blueprint-spec). Every service reaches fs-db over the private network, so a
    # credential that leaks from a process environment is useless outside it (ADR-0005). For psql,
    # open a Shell on fs-api.
    ipAllowList: []
