# CI for every PR and workstream branch (architecture section 15, S5.2.3).
# Every action is pinned by full commit SHA; the tag and its release date are in the trailing comment
# and in docs/versions.md. Bump only through a deps PR.
#
# No path filter, on purpose: the job reads every path. Biome formats Markdown, tests read docs/, media/ and
# assets/, and secretlint scans the whole tree, so skipping a docs or asset change would let it reach main
# unchecked. Minutes are saved instead by cancelling superseded runs (concurrency) and by running no schedule:
# the nightly run here did nothing but gitleaks, which is now gitleaks.yml (full history weekly).
name: ci

on:
  pull_request:
  push:
    # wp/** is a work-package branch, pushed only to try CI on Linux before the merger splits it into ws/<key>.
    branches: [main, "ws/**", "deps/**", "wp/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  verify:
    name: lint, types, tests, boundaries, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history for diffs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm through corepack (version from package.json packageManager)
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (2026-06-26)
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (frozen lockfile)
        id: install
        run: pnpm install --frozen-lockfile

      - name: Work out the diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            base="$(git merge-base origin/main HEAD)"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Diff base: $base"

      # Each check below runs even when an earlier one failed, so one run reports every failure.
      - name: Biome
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.base.outcome == 'success' }}
        run: pnpm exec biome ci --reporter=github .

      # --continue: turbo otherwise stops at the first failing package and hides every other result.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.base.outcome == 'success' }}
        run: pnpm exec turbo run typecheck --continue

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.base.outcome == 'success' }}
        run: pnpm exec turbo run test --continue

      - name: Dependency rule (dependency-cruiser)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.base.outcome == 'success' }}
        run: pnpm deps:check

      # No ownership step here: on pull_request GitHub runs the PR's own copy of this file, so a step here could
      # be edited away by the PR it judges. The gate is ownership.yml (pull_request_target, from main) and the
      # merger's run of main's checker (CONTRIBUTING.md, "Merging"); ADR-0006.

      - name: secretlint (whole tree)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.base.outcome == 'success' }}
        run: pnpm secrets:scan

      - name: Secret guard over changed files
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.base.outcome == 'success' }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git diff -z --name-only --diff-filter=ACMR "$BASE_SHA" HEAD \
            | xargs -0 -r node tools/guard-env.mjs
