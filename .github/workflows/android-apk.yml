# Android APK, built on Ubuntu by hand (handoff T4; architecture section 15). Local EAS builds refuse Windows, and the
# EAS Free cloud budget is small, so this job runs the same Continuous Native Generation path as a local build:
# `expo prebuild` (the android/ folder is generated here and never committed), then `./gradlew assembleRelease`
# with R8 and resource shrinking on (expo-build-properties in apps/mobile/app.config.ts). No Expo login, no EAS.
#
# Signing. When all four repository secrets exist, the APK is re-signed with that key by apksigner (v2 and v3):
#   ANDROID_KEYSTORE_BASE64   the keystore file, base64-encoded (PKCS12 or JKS)
#   ANDROID_KEYSTORE_PASSWORD the keystore password
#   ANDROID_KEY_ALIAS         the key's alias in that keystore
#   ANDROID_KEY_PASSWORD      the key's password
# Otherwise the APK keeps the debug signature the generated project gives release builds, and the artifact's name
# says "not-release-signed". The keystore is decoded into $RUNNER_TEMP and deleted at the end of the job.
#
# The job writes the APK's SHA-256 and each ABI's estimated size against the 35 MB per-ABI budget to the job
# summary. Every action is pinned by full commit SHA (the tag and its date in the trailing comment). setup-java and
# upload-artifact are not in docs/versions.md yet: a deps PR records them (docs/reports/cloud-apk-linux.md).
name: android-apk

# Manual runs only: a release build takes most of an hour of the free Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"
  JAVA_VERSION: "17"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  EXPO_NO_TELEMETRY: "1"
  APK_BUDGET_BYTES: "36700160" # 35 MB (35 x 1024 x 1024)

jobs:
  apk:
    name: assembleRelease (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm through corepack (version from package.json packageManager)
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (2026-06-26)
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (2026-10-14)
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # android/ does not exist until prebuild, so the key hashes what generates it: the lockfile (Expo, React Native
      # and the Gradle plugin versions) and the app config.
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (2026-06-26)
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk${{ env.JAVA_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk${{ env.JAVA_VERSION }}-

      # The versions come from React Native's own catalogue and the app config, so a bump there needs no edit here.
      # sdkmanager from cmdline-tools 23 is a shim over the Android CLI that exits 0 even for an unknown package, so
      # each package's folder is checked afterwards.
      - name: Install the Android SDK packages React Native asks for
        id: sdk
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          toml="$(node -p 'require("node:path").dirname(require.resolve("react-native/package.json"))')/gradle/libs.versions.toml"
          get() { sed -n "s/^$1 = \"\\(.*\\)\"$/\\1/p" "$toml"; }
          compile_sdk="$(get compileSdk)"
          build_tools="$(get buildTools)"
          ndk="$(get ndkVersion)"
          cmake="$(sed -n 's/^ *cmakeVersion: "\(.*\)",.*$/\1/p' app.config.ts)"
          echo "compileSdk=$compile_sdk buildTools=$build_tools ndk=$ndk cmake=${cmake:-none}"
          platform="platforms;android-$compile_sdk"
          if [ ! -d "$ANDROID_HOME/platforms/android-$compile_sdk" ]; then platform="platforms;android-$compile_sdk.0"; fi
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "$platform" "build-tools;$build_tools" "ndk;$ndk" ${cmake:+"cmake;$cmake"}
          for dir in "platforms/${platform#platforms;}" "build-tools/$build_tools" "ndk/$ndk" ${cmake:+"cmake/$cmake"}; do
            test -d "$ANDROID_HOME/$dir" || { echo "::error::Android SDK package missing after install: $dir"; exit 1; }
          done
          echo "build_tools=$ANDROID_HOME/build-tools/$build_tools" >> "$GITHUB_OUTPUT"

      - name: Generate the native project (expo prebuild; never committed)
        working-directory: apps/mobile
        env:
          CI: "1"
        run: pnpm exec expo prebuild --platform android --no-install

      # The API origin is the EAS profiles' (apps/mobile/eas.json build.base.env), read here so the two cannot drift.
      - name: assembleRelease
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          EXPO_PUBLIC_API_ORIGIN="$(node -p 'require("../eas.json").build.base.env.EXPO_PUBLIC_API_ORIGIN')"
          export EXPO_PUBLIC_API_ORIGIN NODE_ENV=production
          ./gradlew assembleRelease --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.internal.repository.max.retries=10 -Dorg.gradle.internal.repository.initial.backoff=500

      - name: Sign (release key when the secrets exist, else keep the debug signature)
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_TOOLS: ${{ steps.sdk.outputs.build_tools }}
        run: |
          set -euo pipefail
          src=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$src"
          version="$(node -p 'require("./apps/mobile/package.json").version')"
          short_sha="${GITHUB_SHA::7}"
          out_dir="$RUNNER_TEMP/apk"
          mkdir -p "$out_dir"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            label=release-signed
            keystore="$RUNNER_TEMP/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            apk="$out_dir/fair-split-$version-$short_sha-$label.apk"
            "$BUILD_TOOLS/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --v4-signing-enabled false --out "$apk" "$src"
            rm -f "$keystore"
          else
            label=not-release-signed
            apk="$out_dir/fair-split-$version-$short_sha-debug-signed-$label.apk"
            cp "$src" "$apk"
            echo "::warning::Release-signing secrets are not all set: the APK keeps the debug signature ($label)."
          fi
          "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$apk"
          {
            echo "label=$label"
            echo "apk=$apk"
            echo "artifact=fair-split-apk-$short_sha-$label"
          } >> "$GITHUB_OUTPUT"

      # The budget is per ABI (design direction, performance budgets: "APK <= 35 MB per ABI, including armeabi-v7a").
      # The job builds one universal APK, so each ABI's size is estimated as the universal APK minus the other three
      # ABIs' native libraries. Against real split APKs (splits.abi, 4 Nov 2026) the estimate was 0.74 to 0.77 MB
      # high, so it is an upper bound.
      - name: Summary (SHA-256, per-ABI size against the 35 MB budget)
        env:
          APK: ${{ steps.sign.outputs.apk }}
          LABEL: ${{ steps.sign.outputs.label }}
          BUILD_TOOLS: ${{ steps.sdk.outputs.build_tools }}
        run: |
          set -euo pipefail
          sha="$(sha256sum "$APK" | cut -d' ' -f1)"
          size="$(stat -c %s "$APK")"
          mib() { awk -v b="$1" 'BEGIN { printf "%.2f", b / 1048576 }'; }
          signer="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^.*certificate DN: //p' | sed -n 1p)"
          listing="$(zipinfo -l "$APK")"
          {
            echo "## Android APK ($LABEL)"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| File | \`$(basename "$APK")\` (universal: all four ABIs) |"
            echo "| SHA-256 | \`$sha\` |"
            echo "| Size | $size bytes ($(mib "$size") MB) |"
            echo "| Signer | $signer |"
            echo
            echo "Per ABI, against the 35 MB budget (estimate: the universal APK minus the other ABIs' native libraries):"
            echo
            echo "| ABI | Estimated APK | Budget | Native libraries (stored) |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            read -r own other < <(awk -v abi="$abi" '$1 ~ /^-/ && $NF ~ /^lib\// {
                if (index($NF, "lib/" abi "/") == 1) own += $6; else other += $6
              } END { printf "%d %d\n", own, other }' <<< "$listing")
            estimate=$((size - other))
            verdict="within"
            if [ "$estimate" -gt "$APK_BUDGET_BYTES" ]; then
              verdict="**over**"
              echo "::warning::$abi: about $(mib "$estimate") MB, over the 35 MB per-ABI budget."
            fi
            echo "| $abi | $(mib "$estimate") MB | $verdict | $(mib "$own") MB |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$sha  $(basename "$APK")" > "$APK.sha256"

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: ${{ steps.sign.outputs.artifact }}
          path: |
            ${{ steps.sign.outputs.apk }}
            ${{ steps.sign.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
