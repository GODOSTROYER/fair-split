<!doctype html>
<!-- Fair Split film v7, section 6: Under the hood, film 120 to 158 s (SCENES C).
     One diagram that follows one slip through the system: a lane on top (slip, data, pay lines, signed, sent,
     paid), four stages named for who does the work, a record strip, a foundation strip. Every name on it is from
     research/film-1111/facts.md sections 7 and 8. The diagram is built by diagram() below; s7-close.html carries
     the same function (copied verbatim between the DIAGRAM markers) so its first frame equals this section's last.
     Structure and rules: CONTRACT.md. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f7f8fb;
        }
      </style>

      <div id="root" data-composition-id="s6-architecture" data-width="1920" data-height="1080" data-duration="38"></div>

      <script>
        (() => {
          /* DIAGRAM:START (keep identical in s6-architecture.html and s7-close.html) */
          const diagram = (host, p) => {
            const NS = "http://www.w3.org/2000/svg";
            const INK = "#0e1525";
            const FAINT = "#c3cad6";
            const INDIGO = "#4a2fd6";
            const JADE = "#14cc90";
            const GROUND = "#f7f8fb";
            // the grid: three 408 columns and the PayPal column at 504, 24 apart, inside 60 px margins
            const COL = [
              { x: 60, w: 408 },
              { x: 492, w: 408 },
              { x: 924, w: 408 },
              { x: 1356, w: 504 },
            ];
            const LANE_Y = 210;
            const CARD_Y = 272;
            const HEAD_H = 92;
            const ROW_H = 90;
            const CARD_H = HEAD_H + ROW_H * 4 + 10;
            const STRIP_Y = CARD_Y + CARD_H + 28;
            const STRIP_H = 112;
            const BASE_Y = STRIP_Y + STRIP_H + 18;
            const BASE_H = 104;
            // lane stops: the slip, then what leaves each stage (centred on the gaps), the request, the money
            const G = { slip: 87, data: 480, pay: 912, seal: 1344, sent: 1672, paid: 1832 };

            const css = `
.${p}-abs{position:absolute;left:0;top:0;margin:0}
.${p}-title{position:absolute;left:60px;top:66px;margin:0;font-size:40px;font-weight:650;line-height:1.1;letter-spacing:-0.02em;color:${INK};white-space:nowrap}
.${p}-line{position:absolute;height:2px;transform-origin:0 50%}
.${p}-cap{position:absolute;width:200px;margin:0;text-align:center;font-size:24px;font-weight:520;line-height:30px;color:#5b6475;white-space:nowrap}
.${p}-node{position:absolute;left:0;top:0;width:0;height:0}
.${p}-node svg{position:absolute;display:block;overflow:visible}
.${p}-chip{position:absolute;left:-38px;top:-28px;width:76px;height:56px;background:#ffffff;border:1px solid #d9dee7;border-radius:10px}
.${p}-chip b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:26px;font-weight:400;line-height:1;color:${INK}}
.${p}-card{position:absolute}
.${p}-card-bg{position:absolute;left:0;top:0;right:0;bottom:0;background:#ffffff;border:1px solid #d9dee7;border-radius:16px}
.${p}-head{position:absolute;left:24px;top:22px;margin:0;display:flex;align-items:baseline;gap:16px;font-size:40px;font-weight:680;line-height:52px;letter-spacing:-0.025em;color:${INK};white-space:nowrap}
.${p}-n{display:inline-block;color:${INDIGO}}
.${p}-row{position:absolute;left:24px;right:24px;height:${ROW_H}px;border-top:1px solid #d9dee7;padding-top:13px}
.${p}-l{margin:0;font-size:30px;font-weight:600;line-height:36px;letter-spacing:-0.01em;color:${INK};white-space:nowrap}
.${p}-m{margin:1px 0 0;font-family:var(--font-mono);font-size:22px;font-weight:400;line-height:28px;word-spacing:-0.2em;color:#5b6475;white-space:nowrap}
.${p}-strip{position:absolute;left:60px;width:1800px;border-radius:16px}
.${p}-strip-bg{position:absolute;left:0;top:0;right:0;bottom:0;background:#ffffff;border:1px solid #d9dee7;border-radius:16px}
.${p}-base-bg{position:absolute;left:0;top:0;right:0;bottom:0;border:1px solid ${FAINT};border-radius:16px}
.${p}-cell{position:absolute;top:22px}
`;
            if (!document.getElementById(`${p}-diagram-style`)) {
              const style = document.createElement("style");
              style.id = `${p}-diagram-style`;
              style.textContent = css;
              document.head.appendChild(style);
            }

            const el = (className, styles = {}, html = "") => {
              const node = document.createElement("div");
              node.className = className;
              Object.assign(node.style, styles);
              if (html) node.innerHTML = html;
              return node;
            };
            const svg = (tag, attrs = {}, kids = []) => {
              const node = document.createElementNS(NS, tag);
              for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
              for (const kid of kids) node.appendChild(kid);
              return node;
            };
            const px = (value) => `${value}px`;
            const layer = el(`${p}-abs`, { width: "1920px", height: "1080px" });
            host.appendChild(layer);
            const add = (node, parent = layer) => parent.appendChild(node);

            const title = add(el(`${p}-title`, {}, "Under the hood"));

            /* ---- the lane ---- */
            const line = (from, to, colour) =>
              add(el(`${p}-line`, { left: px(from), top: px(LANE_Y - 1), width: px(to - from), background: colour }));
            const laneBase = line(G.slip, G.paid, FAINT);
            const seg = [line(G.slip, G.data, INDIGO), line(G.data, G.pay, INDIGO), line(G.pay, G.seal, INDIGO), line(G.seal, G.sent, INDIGO), line(G.sent, G.paid, INDIGO)];
            const node = (x) => add(el(`${p}-node`, { left: px(x), top: px(LANE_Y) }));
            const cap = (x, text) => add(el(`${p}-cap`, { left: px(x - 100), top: px(LANE_Y - 76) }, text));

            // the slip: SCENES A's object
            const slipAt = (x) => {
              const holder = node(x);
              holder.appendChild(FSO.slip({ detail: "mini", flat: true, w: 54, anchor: "center", serial: "0403" }));
              return holder;
            };
            const slip = slipAt(G.slip);
            const slipGo = slipAt(G.slip);

            const chip = (x, inner) => {
              const holder = node(x);
              const box = el(`${p}-chip`);
              box.appendChild(inner);
              holder.appendChild(box);
              return holder;
            };
            const dataMark = () => {
              const b = document.createElement("b");
              b.textContent = "{ }";
              return b;
            };
            // pay lines: three rows, a member and an amount each
            const payMark = () =>
              svg("svg", { width: 76, height: 56, viewBox: "0 0 76 56", style: "left:0;top:0" }, [
                ...[16, 28, 40].flatMap((y, index) => [
                  svg("rect", { x: 13, y: y - 2, width: [22, 17, 25][index], height: 4, rx: 2, fill: FAINT }),
                  svg("rect", { x: 63 - [16, 20, 14][index], y: y - 2, width: [16, 20, 14][index], height: 4, rx: 2, fill: INK }),
                ]),
              ]);
            const data = chip(G.data, dataMark());
            const dataGo = chip(G.data, dataMark());
            const pay = chip(G.pay, payMark());
            const payGo = chip(G.pay, payMark());

            // the batch seal, as the product draws it under 96 px: the inner ring is the treasurer's key, the
            // outer ring the Chair's (packages/seal). Fixed parameters: this is a picture of a seal, not a digest.
            const ringPath = (radius, band, lobes, turns, turn) => {
              const mid = ((band[0] + band[1]) / 200) * radius;
              const amp = ((band[1] - band[0]) / 200) * radius;
              const steps = lobes * 40;
              let d = "";
              for (let index = 0; index <= steps; index += 1) {
                const t = (index / steps) * Math.PI * 2 * turns;
                const r = mid + amp * Math.cos((lobes / turns) * t + turn);
                d += `${index ? "L" : "M"}${(r * Math.cos(t)).toFixed(2)} ${(r * Math.sin(t)).toFixed(2)}`;
              }
              return `${d}Z`;
            };
            const sealAt = (x, size = 76) => {
              const holder = node(x);
              const r = size / 2;
              const ring = (band, lobes, turns, turn) =>
                svg("path", { d: ringPath(r, band, lobes, turns, turn), pathLength: 1, fill: "none", stroke: INDIGO, "stroke-width": 1.5, "stroke-linejoin": "round" });
              const inner = ring([30, 62], 7, 2, 0.4);
              const outer = ring([70, 98], 11, 3, 1.1);
              holder.appendChild(
                svg("svg", { width: size, height: size, viewBox: `${-r} ${-r} ${size} ${size}`, style: `left:${-r}px;top:${-r}px` }, [
                  svg("circle", { cx: 0, cy: 0, r: r + 3, fill: GROUND }),
                  inner,
                  outer,
                ]),
              );
              holder.rings = [inner, outer];
              return holder;
            };
            // the request waiting for its seal: an empty ring
            const slot = node(G.sent);
            slot.appendChild(
              svg("svg", { width: 82, height: 82, viewBox: "-41 -41 82 82", style: "left:-41px;top:-41px" }, [
                svg("circle", { cx: 0, cy: 0, r: 41, fill: GROUND }),
                svg("circle", { cx: 0, cy: 0, r: 37, fill: "none", stroke: FAINT, "stroke-width": 2 }),
              ]),
            );
            const seal = sealAt(G.seal);
            layer.appendChild(payGo); // the arriving batch sits over the seal it is about to become
            const sealGo = sealAt(G.seal);
            // "what they signed is what is sent": the match mark on the request's seal
            const match = node(G.sent + 30);
            match.style.top = px(LANE_Y + 28);
            const matchTick = svg("path", { d: "M-6 0.5L-2 4.5L6.5 -4.5", pathLength: 1, fill: "none", stroke: "#ffffff", "stroke-width": 2.6, "stroke-linecap": "round", "stroke-linejoin": "round" });
            match.appendChild(
              svg("svg", { width: 28, height: 28, viewBox: "-14 -14 28 28", style: "left:-14px;top:-14px" }, [
                svg("circle", { cx: 0, cy: 0, r: 14, fill: GROUND }),
                svg("circle", { cx: 0, cy: 0, r: 11.5, fill: INDIGO }),
                matchTick,
              ]),
            );
            // money that has arrived: the film's one jade in this section
            const paid = node(G.paid);
            const paidTick = svg("path", { d: "M-11 1L-3.5 8.5L11.5 -8", pathLength: 1, fill: "none", stroke: INK, "stroke-width": 4.5, "stroke-linecap": "round", "stroke-linejoin": "round" });
            paid.appendChild(
              svg("svg", { width: 72, height: 72, viewBox: "-36 -36 72 72", style: "left:-36px;top:-36px" }, [
                svg("circle", { cx: 0, cy: 0, r: 36, fill: GROUND }),
                svg("circle", { cx: 0, cy: 0, r: 28, fill: JADE }),
                paidTick,
              ]),
            );
            const caps = {
              slip: cap(G.slip, "slip"),
              data: cap(G.data, "data"),
              pay: cap(G.pay, "pay lines"),
              seal: cap(G.seal, "signed"),
              sent: cap(G.sent, "sent"),
              paid: cap(G.paid, "paid"),
            };

            /* ---- the four stages ---- */
            const STAGES = [
              {
                head: "AI reads",
                rows: [
                  ["Reads each slip twice", "claude-opus-5-5 ×2"],
                  ["Ignores hidden orders", "claude-haiku-5-5"],
                  ["Unsure? Ask a person.", "auto-accept ≥ 0.85"],
                  ["Data out. No amounts.", "packages/ai"],
                ],
              },
              {
                head: "Code computes",
                rows: [
                  ["Pay engine, whole cents", "packages/domain"],
                  ["Every cent adds up", "invariant I3 · fast-check"],
                  ["Rules sealed first", "rate card · SHA-256"],
                  ["Holds the unexplained", "holds · mass balance ±2.0%"],
                ],
              },
              {
                head: "People approve",
                rows: [
                  ["Treasurer's key", "Ed25519"],
                  ["Chair's key", "Ed25519"],
                  ["One batch fingerprint", "batchSha256"],
                  ["Any change voids it", "executeApproved()"],
                ],
              },
              {
                head: "PayPal pays",
                rows: [
                  ["Invoice", "Invoicing v2 · Agent Toolkit 1.11.0"],
                  ["Payouts", "Payouts v1 · our typed tool"],
                  ["Sent exactly once", "outbox · PayPal-Request-Id"],
                  ["Signed notices back", "webhooks"],
                ],
              },
            ];
            const stages = STAGES.map((stage, index) => {
              const card = add(el(`${p}-card`, { left: px(COL[index].x), top: px(CARD_Y), width: px(COL[index].w), height: px(CARD_H) }));
              const bg = add(el(`${p}-card-bg`), card);
              const head = add(el(`${p}-head`), card);
              const n = document.createElement("span");
              n.className = `${p}-n`;
              n.textContent = String(index + 1);
              const h = document.createElement("span");
              h.textContent = stage.head;
              head.append(n, h);
              const rows = stage.rows.map(([label, mono], rowIndex) =>
                add(el(`${p}-row`, { top: px(HEAD_H + rowIndex * ROW_H) }, `<p class="${p}-l">${label}</p><p class="${p}-m">${mono}</p>`), card),
              );
              return { card, bg, n, h, rows };
            });

            /* ---- every step lands in the record ---- */
            const drops = COL.map((col) =>
              add(el(`${p}-line`, { left: px(col.x + col.w / 2 - 1), top: px(CARD_Y + CARD_H), width: "2px", height: "28px", background: FAINT, transformOrigin: "50% 0" })),
            );
            const strip = add(el(`${p}-strip`, { top: px(STRIP_Y), height: px(STRIP_H) }));
            const stripBg = add(el(`${p}-strip-bg`), strip);
            const cell = (parent, x, label, mono) => add(el(`${p}-cell`, { left: px(x) }, `<p class="${p}-l">${label}</p><p class="${p}-m">${mono}</p>`), parent);
            // strip x is measured from the strip's own left edge (60): cells start on the column grid
            const cells = [
              cell(strip, 24, "Tamper-evident record", "hash-chained ledger · Postgres"),
              cell(strip, 888, "Member statement", "en · ceb · fil"),
              cell(strip, 1320, "Proof", "six checks in the browser"),
            ];
            // the chain: each entry seals the one before it
            const chainSvg = svg("svg", { width: 300, height: 40, viewBox: "0 0 300 40", style: `position:absolute;left:450px;top:${STRIP_H / 2 - 20}px;overflow:visible` });
            const links = [];
            for (let index = 0; index < 5; index += 1) {
              const x = 6 + index * 62;
              const block = svg("rect", { x, y: 8, width: 24, height: 24, rx: 6, fill: "#ffffff", stroke: INK, "stroke-width": 2 });
              const bar = index > 0 ? svg("path", { d: `M${x - 38} 20H${x}`, pathLength: 1, fill: "none", stroke: INK, "stroke-width": 2 }) : null;
              if (bar) chainSvg.appendChild(bar);
              chainSvg.appendChild(block);
              links.push({ block, bar });
            }
            strip.appendChild(chainSvg);
            const arrow = (x) => {
              const shaft = svg("path", { d: "M-15 0H13", fill: "none", stroke: INK, "stroke-width": 2, "stroke-linecap": "round" });
              const tip = svg("path", { d: "M6 -7L13.5 0L6 7", fill: "none", stroke: INK, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" });
              const holder = svg("svg", { width: 32, height: 20, viewBox: "-16 -10 32 20", style: `position:absolute;left:${x - 16}px;top:${STRIP_H / 2 - 10}px;overflow:visible` }, [shaft, tip]);
              strip.appendChild(holder);
              return holder;
            };
            const arrows = [arrow(852), arrow(1284)];

            /* ---- what it all stands on ---- */
            const base = add(el(`${p}-strip`, { top: px(BASE_Y), height: px(BASE_H) }));
            add(el(`${p}-base-bg`), base);
            const baseCells = [
              cell(base, 24, "One TypeScript service", "Hono API · Postgres · live updates over SSE · React console · Expo app"),
              cell(base, 1320, "5,000+ automated tests", "Vitest · fast-check · Playwright"),
            ];
            baseCells.forEach((node) => {
              node.style.top = "18px";
            });

            return { layer, title, laneBase, seg, slip, slipGo, data, dataGo, pay, payGo, seal, sealGo, slot, match, matchTick, paid, paidTick, caps, stages, drops, strip, stripBg, cells, links, arrows, base, baseCells, G };
          };
          /* DIAGRAM:END */

          /* COMPARE:START (keep identical in s5-compare.html and s6-architecture.html) */
          const compare = (host, p) => {
            const css = `
.${p}-cmp{position:absolute;left:0;top:0;width:1920px;height:1080px;margin:0}
.${p}-cmp-k{position:absolute;margin:0;font-size:40px;font-weight:650;line-height:48px;letter-spacing:-0.015em;color:#5b6475;white-space:nowrap}
.${p}-cmp-big{position:absolute;margin:0;font-size:132px;font-weight:680;line-height:1;letter-spacing:-0.035em;color:#0e1525;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
.${p}-cmp-big i{font-style:normal;font-weight:600;letter-spacing:0;margin-left:0.12em}
.${p}-cmp-w{position:absolute;margin:0;font-size:52px;font-weight:620;line-height:60px;letter-spacing:-0.02em;color:#0e1525;white-space:nowrap}
.${p}-cmp-note{position:absolute;margin:0;font-size:32px;font-weight:500;line-height:40px;color:#5b6475;white-space:nowrap}
.${p}-cmp-rule{position:absolute;left:959px;top:150px;width:2px;height:780px;background:#d9dee7;transform-origin:50% 0}
.${p}-cmp-obj{position:absolute;left:0;top:0}
`;
            if (!document.getElementById(`${p}-cmp-style`)) {
              const style = document.createElement("style");
              style.id = `${p}-cmp-style`;
              style.textContent = css;
              document.head.appendChild(style);
            }
            const el = (className, styles = {}, html = "") => {
              const node = document.createElement("div");
              node.className = className;
              Object.assign(node.style, styles);
              if (html) node.innerHTML = html;
              return node;
            };
            const layer = el(`${p}-cmp`);
            host.appendChild(layer);
            const add = (node) => layer.appendChild(node);
            const LEFT = 150;
            const RIGHT = 1100;

            // before
            const before = add(el(`${p}-cmp-k`, { left: `${LEFT}px`, top: "150px" }, "Before"));
            const boxHold = add(el(`${p}-cmp-obj`));
            boxHold.appendChild(FSO.box({ w: 360, slips: 6, pink: 3, x: LEFT, y: 322 }));
            const bookHold = add(el(`${p}-cmp-obj`));
            bookHold.appendChild(
              FSO.notebook({
                w: 244,
                x: LEFT + 420,
                y: 294,
                rows: [
                  { name: 0.4, value: "38.45" },
                  { name: 0.8, value: "21.90" },
                  { name: 0.5, value: "64.50" },
                  { name: 0.2, value: "17.06" },
                  { name: 0.7, value: "42.10" },
                ],
              }),
            );
            const trust = add(el(`${p}-cmp-big`, { left: `${LEFT - 6}px`, top: "690px" }, "Trust"));

            // now
            const rule = add(el(`${p}-cmp-rule`));
            const now = add(el(`${p}-cmp-k`, { left: `${RIGHT}px`, top: "150px" }, "Now"));
            const steps = ["Read", "Computed", "Signed", "Paid", "Proven"].map((word, index) => {
              const y = 238 + index * 76;
              const mark = FSO.tick({ size: 50, weight: 5.5, color: word === "Paid" ? "#14cc90" : "#4a2fd6", x: RIGHT - 4, y: y + 5 });
              layer.appendChild(mark);
              const text = add(el(`${p}-cmp-w`, { left: `${RIGHT + 68}px`, top: `${y}px` }, word));
              return { mark, text };
            });
            const time = add(el(`${p}-cmp-big`, { left: `${RIGHT - 6}px`, top: "690px" }, "53.6<i>s</i>"));
            const note = add(el(`${p}-cmp-note`, { left: `${RIGHT}px`, top: "842px" }, "payment to payout, in our demo"));
            return { layer, before, boxHold, bookHold, trust, rule, now, steps, time, note };
          };
          /* COMPARE:END */

          const tl = gsap.timeline({ paused: true });
          const root = document.querySelector('[data-composition-id="s6-architecture"]');
          const d = diagram(root, "s6");
          // the first frame is section 5's last (before and now); it clears before the voice starts
          const before = compare(root, "s6");
          tl.fromTo(before.layer, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in" }, 0.04);
          const { G } = d;
          const E = FILM.ease;
          const LAST = 37.0; // nothing starts after this: the finished diagram holds still to the cut
          const at = (text, nth = 1, offset = 0) => Math.min(FILM.at("s6", text, nth, offset), LAST);
          const atEnd = (text, nth = 1, offset = 0) => Math.min(FILM.atEnd("s6", text, nth, offset), LAST);

          const rise = (target, position, y = 12, duration = 0.5) =>
            tl.fromTo(target, { opacity: 0, y }, { opacity: 1, y: 0, duration, ease: E }, Math.min(position, LAST));
          const show = (target, position, duration = 0.4) =>
            tl.fromTo(target, { opacity: 0 }, { opacity: 1, duration, ease: "power2.out" }, Math.min(position, LAST));
          const draw = (path, position, duration = 0.5) => {
            path.setAttribute("stroke-dasharray", "1 1");
            tl.fromTo(path, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration, ease: "power2.out" }, Math.min(position, LAST));
          };
          /** One leg of the journey: the lane turns indigo from `from` to `to`, `leaving` rides its tip and fades,
              `arriving` rides with it and resolves at the stop. */
          const travel = (segment, leaving, arriving, from, to, position, duration = 0.8) => {
            const start = Math.min(position, LAST);
            tl.fromTo(segment, { scaleX: 0 }, { scaleX: 1, duration, ease: E }, start);
            tl.fromTo(leaving, { x: 0 }, { x: to - from, duration, ease: E }, start);
            tl.fromTo(leaving, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, start);
            tl.to(leaving, { opacity: 0, duration: duration * 0.45, ease: "power1.in" }, start + duration * 0.2);
            tl.fromTo(arriving, { x: from - to }, { x: 0, duration, ease: E }, start);
            tl.fromTo(arriving, { opacity: 0 }, { opacity: 1, duration: duration * 0.5, ease: "power1.out" }, start + duration * 0.25);
          };

          /* 0. "Under the hood, four rules." */
          rise(d.title, at("Under"), 16, 0.6);
          tl.fromTo(d.laneBase, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: E }, at("hood"));
          rise(d.slip, at("hood"), 10);
          show(d.caps.slip, at("hood", 1, 0.15));
          d.stages.forEach((stage, index) => {
            rise(stage.n, at("four", 1, index * 0.1), 14);
          });

          const stage = (index, word, headWord, nth = 1) => {
            const s = d.stages[index];
            show(s.bg, at(word, nth), 0.5);
            tl.fromTo(s.n, { color: "#c3cad6" }, { color: "#4a2fd6", duration: 0.3, ease: "power2.out" }, at(word, nth));
            rise(s.h, at(headWord), 12);
            return s.rows;
          };

          /* 1. "One: AI only reads. Claude turns slips into data, and never touches a number." */
          let rows = stage(0, "One:", "AI");
          rise(rows[0], at("Claude"));
          rise(rows[1], at("slips"));
          travel(d.seg[0], d.slipGo, d.data, G.slip, G.data, at("into", 1, -0.25));
          show(d.caps.data, at("data"));
          rise(rows[2], at("data", 1, 0.3));
          rise(rows[3], at("never"));

          /* 2. "Two: code does the math, under rules sealed before the season." */
          rows = stage(1, "Two:", "code");
          travel(d.seg[1], d.dataGo, d.pay, G.data, G.pay, at("does"));
          rise(rows[0], at("math", 1, -0.2));
          show(d.caps.pay, at("math", 1, 0.3));
          rise(rows[1], at("math", 1, 0.45));
          rise(rows[2], at("sealed", 1, -0.1));
          rise(rows[3], at("season", 1, 0.3));

          /* 3. "Three: people approve. Two signatures lock one fingerprint of the batch." */
          rows = stage(2, "Three:", "people");
          const [ringIn, ringOut] = d.seal.rings;
          // the batch of pay lines arrives; each signature draws one ring of its seal
          const batchAt = at("approve", 1, 0.25);
          tl.fromTo(d.seg[2], { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: E }, batchAt);
          tl.fromTo(d.payGo, { x: 0 }, { x: G.seal - G.pay, duration: 0.8, ease: E }, batchAt);
          tl.fromTo(d.payGo, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, batchAt);
          show(d.seal, batchAt, 0.01);
          rise(rows[0], at("Two", 2));
          draw(ringIn, at("Two", 2), 0.7);
          rise(rows[1], at("signatures", 1, 0.1));
          draw(ringOut, at("lock", 1, -0.1), 0.7);
          tl.to(d.payGo, { opacity: 0, scale: 0.4, duration: 0.5, ease: "power2.out" }, at("Two", 2));
          rise(rows[2], at("fingerprint"));
          show(d.caps.seal, at("fingerprint"));
          rise(rows[3], atEnd("batch", 1, 0.25));

          /* 4. "Four: PayPal moves the money. The invoice goes through PayPal's Agent Toolkit; payouts through our
                own tool, sent exactly once, and confirmed by signed notices." */
          rows = stage(3, "Four:", "PayPal", 2);
          rise(rows[0], at("invoice"));
          rise(rows[1], at("payouts"));
          show(d.slot, at("payouts", 1, 0.2));
          rise(rows[2], at("sent"));
          // the seal the officers signed travels with the request, and matches
          const sendAt = at("sent");
          tl.fromTo(d.seg[3], { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: E }, sendAt);
          tl.fromTo(d.sealGo, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, sendAt);
          tl.fromTo(d.sealGo, { x: 0 }, { x: G.sent - G.seal, duration: 0.8, ease: E }, sendAt);
          show(d.caps.sent, sendAt + 0.6);
          show(d.match, sendAt + 0.8, 0.2);
          draw(d.matchTick, sendAt + 0.85, 0.3);
          tl.fromTo(d.seg[4], { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: E }, at("confirmed"));
          tl.fromTo(d.paid, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: E }, at("confirmed", 1, 0.3));
          draw(d.paidTick, at("confirmed", 1, 0.5), 0.35);
          show(d.caps.paid, at("confirmed", 1, 0.5));
          rise(rows[3], at("signed"));

          /* 5. "Every step is chained into a tamper-evident record." */
          d.drops.forEach((drop, index) => {
            tl.fromTo(drop, { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power2.out" }, at("Every", 1, index * 0.07));
          });
          show(d.stripBg, at("step"), 0.5);
          d.links.forEach((link, index) => {
            const when = at("chained", 1, index * 0.12);
            if (link.bar) draw(link.bar, when - 0.08, 0.2);
            tl.fromTo(link.block, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, when);
          });
          rise(d.cells[0], at("chained", 1, 0.45));
          show(d.arrows[0], at("tamper-evident", 1, 0.25), 0.3);
          rise(d.cells[1], at("tamper-evident", 1, 0.3));
          show(d.arrows[1], at("record", 1, 0.15), 0.3);
          rise(d.cells[2], at("record", 1, 0.2));

          /* 6. the voice ends; the foundation arrives; the finished diagram holds still to the cut */
          const baseAt = Math.min(atEnd("record", 1, 0.1), 36.0);
          rise(d.base, baseAt, 14, 0.6);

          window.__timelines["s6-architecture"] = tl;
        })();
      </script>
    </template>
  </body>
