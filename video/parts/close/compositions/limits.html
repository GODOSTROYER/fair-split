      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const sel = (id, s) => `#${id} ${s}`;

          // ---------- ambient: daylight arrives, the light field drifts ----------
          tl.fromTo("#lim-wash", { opacity: 0, x: 0 }, { opacity: 1, x: 70, duration: 13, ease: "sine.out" }, 0);
          tl.fromTo("#lim-orb-a", { x: 0, y: 30, opacity: 0.4 }, { x: -120, y: -20, opacity: 1, duration: 13, ease: "sine.inOut" }, 0);

          tl.fromTo("#lim-orb-c", { x: 0, y: 0 }, { x: 180, y: -40, duration: 13, ease: "sine.inOut" }, 0);
          tl.fromTo("#lim-cam", { scale: 1, y: 0 }, { scale: 1.03, y: -8, duration: 13, ease: "sine.inOut" }, 0);

          // "the limits." small and grey, like the reference's first bright frame

          tl.to("#lim-intro", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 0.72);

          // later chips wait for their disclosure
          tl.fromTo(["#lim-c2", "#lim-c3", "#lim-c4", "#lim-c5"], { opacity: 0, scale: 0.8 }, { opacity: 0, scale: 0.8, duration: 0.01 }, 0);

          const ITEMS = [
            { id: "lim-i1", in: 0.9, out: 3.3, chip: "#lim-c1", dx: -765 },
            { id: "lim-i2", in: 3.55, out: 5.12, chip: "#lim-c2", dx: -487 },
            { id: "lim-i3", in: 5.35, out: 7.8, chip: "#lim-c3", dx: -222 },
            { id: "lim-i4", in: 8.05, out: 10.95, chip: "#lim-c4", dx: 24 },
            { id: "lim-i5", in: 11.2, out: 12.6, chip: "#lim-c5", dx: 438 },
          ];

          ITEMS.forEach((it, n) => {
            const head = `#${it.id} .lim-head`;
            const words = sel(it.id, ".lim-w");
            const tags = sel(it.id, ".lim-tag");
            const ul = sel(it.id, ".lim-ul");
            // entrance: a different verb per disclosure, the same calm resolve
            if (n === 0 || n === 4) {
              tl.fromTo(words, { yPercent: 112 }, { yPercent: 0, duration: 0.8, ease: n === 0 ? "expo.out" : "circ.out", stagger: 0.08 }, it.in);
            } else if (n === 1) {
              tl.fromTo(words, { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out", stagger: 0.1 }, it.in);
            } else if (n === 2) {
              tl.fromTo(words, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.7, ease: "power4.out", stagger: 0.07 }, it.in);
            } else {
              tl.fromTo(head, { opacity: 0, scale: 1.12, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.0, ease: "expo.out" }, it.in);
            }
            tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, it.in + 0.38);
            tl.fromTo(tags, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", stagger: 0.12 }, it.in + 0.46);

            // resolve: the headline lifts away and the tag files itself into the ledger
            tl.to(head, { opacity: 0, y: -44, duration: 0.3, ease: "power2.in" }, it.out);
            tl.to(tags, { opacity: 0, x: it.dx, y: -540, scale: 0.32, duration: 0.44, ease: "power3.in" }, it.out + 0.02);
            if (n === 0) {
              tl.to(it.chip, { scale: 1.1, duration: 0.16, ease: "power2.out" }, it.out + 0.42);
              tl.to(it.chip, { scale: 1, duration: 0.3, ease: "power2.inOut" }, it.out + 0.58);
            } else {
              tl.to(it.chip, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2)" }, it.out + 0.3);
            }
