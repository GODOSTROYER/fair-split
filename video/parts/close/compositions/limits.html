            const gsap = window.gsap;
            const PE = (name) => gsap.parseEase(name);

              p2o: PE("power2.out"),
              p2i: PE("power2.in"),

              { t: 20.3, x: 7037, y: -10, s: 1, dip: 0.3 }, // synthesized.: the statement's voice
              { t: 21.0, x: 7041, y: -10, s: 1.006 },
              { t: 23.05, x: 8937, y: 0, s: 1, dip: 0.3 }, // glide into the overview: the trace, the end line, the name
              { t: 32.0, x: 8945, y: 0, s: 1.025 },
            ];
            function camAt(tc) {
              if (tc <= CAM[0].t) return CAM[0];
              for (let i = 1; i < CAM.length; i++) {
                const a = CAM[i - 1];
                const b = CAM[i];
                if (tc <= b.t) {
                  const u = (tc - a.t) / (b.t - a.t);
                  const e = E.sio(u);
                  const es = b.sf ? E.sio(Math.min(1, u / b.sf)) : e;
                  const dip = b.dip ? 1 - b.dip * Math.sin(Math.PI * e) : 1;
                  const s = b.log ? Math.exp(lerp(Math.log(a.s), Math.log(b.s), es)) : lerp(a.s, b.s, es);
                  return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), s: s * dip };
                }
              }
              return CAM[CAM.length - 1];
            }

            // The handwritten weigh-slip's focus: the camera pushes in on its Net row and the rest of the slip blurs, greys
            // and fades into the field, so the boxed 38.45 is the one readable thing on it (STYLE §2). Its edges dissolve
            // first (by 8.55 s, before the push lifts them into the keyword's box), then the blur follows the push.
            const slipFocus = (tc) => E.p2io(prog(tc, 7.75, 9.35));
            const slipEdges = (tc) => E.p2io(prog(tc, 7.75, 8.55));

            // The world: one line of objects in the order they are visited. `vis` [in0, in1(, out0, out1)] (close time) fades
            // an object in and out with the move, so none lingers at an edge (STYLE §4). `focus` blurs, greys and fades the
            // object's `.fx-base` image and keeps a sharp `.fx-sharp` copy inside a soft ellipse [cx, cy, rx, ry, inner %]
            // (object px): small text is blurred out of reading, the one figure that matters stays sharp.
            // `ew` is the width that carries ink (object px), for the edge fade when it is narrower than the object's box.
            const WORLD = {
              // the figures: 5,000+ inside its tick ring (782 px across), 3 over its three switches
              tests: { x: 0, y: -20, w: 1600, h: 400, sc: 1, ew: 782 },
              // the 3 leaves with the exit glide, faded before it reaches the frame's edge (STYLE §4, review v4 items 5, 7)
              kill: { x: 2000, y: -20, w: 1600, h: 400, sc: 1, ew: 420, vis: [0, 0, 5.85, 6.2] },
              slip: {
                x: 3240,
                y: 92,
                w: 600,
                h: 732,
                sc: 0.82,
                A: 5,
                ry: 4,
                rx: 1.5,
                rot: -1.2,
                ph: 0.4,
                // it comes in over the right edge as the exit glide carries it in (5.6-5.95), never cut off at full strength
                vis: [5.6, 5.95, 11.2, 11.55],
                focus: {
                  f: slipFocus,
                  vf: slipEdges,
                  blur: 4.6,
                  fade: 0.6,
                  keep: 0.3,
                  sat: 0.5,
                  // the sharp band is the Net row alone (review v4 item 4): 38.45 (slip px 257-318 x 357-373) stays sharp,
                  // the row's own rules (347, 380) soften, and 0.30 above it and 6.8 below it are only in the blurred base
                  sharp: [288, 364.5, 92, 24, 55],
                  vig: [300, 388, 430, 340],
                },
              },
              // simulated.: the payout, the peso card's "Paid US$64.45" at 36 px and more (the rest of the sum blurred)
              peso: {
                x: 4284,
                y: 110,
                w: 692,
                h: 192,
                sc: 1.75,
                A: 5,
                ry: 4,
                rx: 2,
                rot: 0.6,
                ph: 1.7,
                vis: [11.0, 11.35, 15.1, 15.45],
                focus: { blur: 7, fade: 0.35, sat: 1, sharp: [502, 62, 112, 56, 62] },
              },
              // synthetic.: the co-op's 64 members, the opening's dots gathered once more into a ring, beside the slip images
              dots: { x: 5173, y: 90, w: 560, h: 560, sc: 1, ph: 2.9, vis: [15.0, 15.0, 17.8, 18.3] },
              // synthetic.: three slip images, made in code; replayed.: the reading lifts out of the front one
              fan: {
                x: 5833,
                y: 100,
                w: 820,
                h: 640,
                sc: 0.8,
                A: 5,
                ry: 4,
                rx: 1.5,
                rot: 0,
                ph: 2.3,
                vis: [15.0, 15.0, 19.9, 20.3],
              },
              read: {
                x: 5793,
                y: 250,
                w: 960,
                h: 200,
                sc: 1.1,
                A: 4,
                ry: 3,
                rx: 1.5,
                rot: -0.5,
                ph: 0.9,
                vis: [17.6, 17.6, 19.9, 20.3],
              },
              // synthesized.: the member's statement, said aloud; the glide into the overview carries it off the frame
              wave: { x: 7207, y: 110, w: 1000, h: 280, sc: 1, vis: [19.0, 19.4] },
              // the overview: slip -> phone on one gentle line, in the order the data flows (STYLE §4); the slip is blurred
              // out of reading and only her US$64.45 stays sharp on the phone
              oslip: {
                x: 8637,
                y: 20,
                w: 600,
                h: 732,
                sc: 0.66,
                A: 5,
                ry: 4,
                rx: 1.5,
                rot: -1.2,
                ph: 0.2,
                focus: { blur: 4, fade: 0.08, sat: 0.5 },
              },
              phone: {
                x: 9257,
                y: -5,
                w: 355,
                h: 822.5,
                sc: 0.78,
                A: 6,
                ry: -6,
                rx: 2,
                rot: 0,
                ph: 3.1,
                focus: { blur: 4.6, fade: 0.06, sat: 1, sharp: [138, 451.5, 132, 54, 62] },
              },
            };

            // The statement's voice: an ink wave out of a play disc, grown from a flat line as the keyword lands, travelling
            // outwards (≤ 1.2 Hz at any point). Shared so the limits and the end draw the same pixels at 21 s.
            function wavePaths(tc) {
              const T = FILM0 + tc;
              const grow = E.p2o(prog(tc, 19.4, 20.25));
              const main = [];
              const echo = [];
              for (let i = 0; i <= 180; i++) {
                const u = i / 180;
                const x = 150 + 820 * u;
                const taper = Math.sin(Math.PI * Math.min(1, u * 1.08)) ** 0.9;
                const syll = 0.32 + 0.68 * Math.abs(Math.sin(Math.PI * (4.6 * u - 1.05 * T))) ** 1.6;
                const a = 92 * grow * taper * syll;
                main.push(`${x.toFixed(1)},${(140 + a * Math.sin(TAU * 8.5 * u - 6.9 * T)).toFixed(1)}`);
                echo.push(`${x.toFixed(1)},${(140 + 0.62 * a * Math.sin(TAU * 8.5 * u - 6.9 * T - 1.3)).toFixed(1)}`);
              }
              return { main: `M${main.join("L")}`, echo: `M${echo.join("L")}` };
            }

            // grain: four seeded grey tiles, one per frame at a seeded offset, as in film-slots.js (STYLE §10)
            function grainPatterns(context) {
              const rng = mulberry32(1104);
              return [0, 1, 2, 3].map(() => {
                const canvas = document.createElement("canvas");
                canvas.width = 256;
                canvas.height = 256;
                const tile = canvas.getContext("2d");
                const image = tile.createImageData(256, 256);
                for (let i = 0; i < 256 * 256; i++) {
                  const v = Math.round((255 * (rng() + rng())) / 2);
                  image.data[4 * i] = v;
                  image.data[4 * i + 1] = v;
                  image.data[4 * i + 2] = v;
                  image.data[4 * i + 3] = 255;
                }
                tile.putImageData(image, 0, 0);
                return context.createPattern(canvas, "repeat");
              });
            }

            const ellipse = (cx, cy, rx, ry, inner) =>
              `radial-gradient(${rx}px ${ry}px at ${cx}px ${cy}px, #000 ${inner}%, transparent 100%)`;
            function setMask(el, value) {
              el.style.maskImage = value;
              el.style.webkitMaskImage = value;
              el.style.maskRepeat = "no-repeat";
              el.style.webkitMaskRepeat = "no-repeat";
            }

            /**
             * cfg.id: the id prefix; cfg.t0: the composition's start in close time; cfg.keys: the WORLD objects this
             * composition draws (its own and its neighbours' at the joints), each an element `${id}-${key}`.
             */
            function create(cfg) {
              const $ = (key) => document.getElementById(`${cfg.id}-${key}`);
              // the field: the same light shapes, wash, leaf shadows and drift as the capture-slot beats (film-slots.js),
              // so the cut in from 142.9 s is invisible; the camera adds a gentle parallax on top
              const lights = [
                { el: $("lightA"), x: -700, y: -620, k: 0.5, dx: 60, dy: 40, f: 0.05, p: 0.03 },
                { el: $("lightC"), x: 900, y: -560, k: 0.8, dx: -50, dy: 50, f: 0.04, p: 0.045 },
                { el: $("lightB"), x: 160, y: 120, k: 1.1, dx: 70, dy: -40, f: 0.035, p: 0.06 },
              ];
              const dapple = $("dapple");
              const world = $("worldMb");
              const mblur = $("mblurG");
              const grain = $("grain");
              const gctx = grain.getContext("2d");
              const patterns = grainPatterns(gctx);
              const objs = {};
              for (const key of cfg.keys) {
                const o = { A: 0, ry: 0, rx: 0, rot: 0, ph: 0, ...WORLD[key], key, el: $(key) };
                if (o.focus) {
                  o.fx = {
                    base: o.el.querySelector(".fx-base"),
                    sharp: o.el.querySelector(".fx-sharp"),
                    shadow: o.el.querySelector(".fx-shadow"),
                    key: "",
                  };
                  if (o.fx.sharp) {
                    setMask(o.fx.sharp, ellipse(...o.focus.sharp));
                    o.fx.sharp.style.filter = `saturate(${o.focus.sat})`;
                  }
                }
                objs[key] = o;
              }

              function focus(o, tc) {
                const F = o.focus;
                const f = F.f ? F.f(tc) : 1;
                const v = F.vf ? F.vf(tc) : f;
                const key = `${f.toFixed(3)} ${v.toFixed(3)}`;
                if (o.fx.key === key) return;
                o.fx.key = key;
                o.fx.base.style.filter = `blur(${(F.blur * f).toFixed(2)}px) saturate(${F.sat})`;
                o.fx.base.style.opacity = (1 - F.fade * f).toFixed(3);
                // the vignette closes from beyond the corners to its ellipse, dissolving the paper's edges into the field
                if (F.vig) {
                  const [cx, cy, rx, ry] = F.vig;
                  const w = (1 - v) ** 2;
                  if (v > 0.001)
                    setMask(o.fx.base, ellipse(cx, cy, (rx + 1800 * w).toFixed(1), (ry + 1800 * w).toFixed(1), 34));
                  else setMask(o.fx.base, "none");
                }
                // `keep` fades the sharp copy a little with the base, so the pool of focus keeps the paper's tone
                if (o.fx.sharp)
                  o.fx.sharp.style.opacity = f > 0.001 || v > 0.001 ? (1 - (F.keep || 0) * f).toFixed(3) : "0";
                if (o.fx.shadow) o.fx.shadow.style.opacity = (1 - (F.vig ? v : f)).toFixed(3);
              }

              function place(o, tc, T, c) {
                const S = o.sc * c.s;
                const sx = 960 + (o.x - c.x) * c.s;
                const sy = 540 + (o.y - c.y) * c.s;
                o.st = {
                  sx,
                  sy,
                  S,
                  bob: o.A * Math.sin((TAU * T) / 5.6 + o.ph),
                  ry: o.ry * Math.sin((TAU * T) / 8 + o.ph),
                  rx: o.rx,
                  rot: o.rot,
                };
                const halfW = (o.w * S) / 2;
                const halfH = (o.h * S) / 2;
                const inFrame = sx + halfW > -40 && sx - halfW < 1960 && sy + halfH > -40 && sy - halfH < 1120;
                const vis = o.vis
                  ? Math.min(prog(tc, o.vis[0], o.vis[1]), o.vis.length > 2 ? 1 - prog(tc, o.vis[2], o.vis[3]) : 1)
                  : 1;
                // an object the camera carries over the frame's left or right edge fades with the move (STYLE §4, review v4
                // item 7): its opacity falls as its inked width passes the 64 px margin, gone by the time 30% of it is past
                // the line, so no glide shows a window cut off by the frame at full strength. A close-up wider than the frame
                // is meant to overflow it and keeps its opacity.
                const half = ((o.ew ?? o.w) * S) / 2;
                const over = Math.max(0, 64 - (sx - half), sx + half - 1856);
                const atEdge = half > 850 ? 1 : 1 - E.sio(clamp01(over / Math.max(180, 0.6 * half)));
                const live = inFrame && vis * atEdge > 0.002;
                // windows that have left the frame are switched off, so none lingers at an edge (STYLE §4)
                o.el.style.opacity = live ? (vis * atEdge).toFixed(3) : "0";
                if (!live) return;
                const st = o.st;
                o.el.style.transform = `translate(${sx.toFixed(2)}px, ${sy.toFixed(2)}px) scale(${S.toFixed(4)}) perspective(2200px) rotateY(${st.ry.toFixed(2)}deg) rotateX(${st.rx.toFixed(2)}deg) rotate(${st.rot.toFixed(2)}deg) translateY(${st.bob.toFixed(2)}px)`;
                if (o.fx) focus(o, tc);
                // depth of field: sharp within 220 px of the centre, up to 10 px further out, less when pulled back
                const edge = Math.max(Math.abs(sx - 960) - halfW, Math.abs(sy - 540) - halfH);
                const blur = clamp01((edge - 220) / 480) * 10 * clamp01((c.s - 0.62) / 0.3);
                o.el.style.filter = blur > 0.15 ? `blur(${blur.toFixed(2)}px)` : "none";
              }

              /** A point given in an object's own px -> screen (2D: position, scale, rotation and float). */
              function toScreen(key, px, py) {
                const o = objs[key];
                const st = o.st;
                const qx = px - o.w / 2;
                const qy = py - o.h / 2 + st.bob;
                const r = (st.rot * Math.PI) / 180;
                const cs = Math.cos(r);
                const sn = Math.sin(r);
                return { x: st.sx + st.S * (qx * cs - qy * sn), y: st.sy + st.S * (qx * sn + qy * cs) };
              }

              function draw(t) {
                const tc = cfg.t0 + t;
                const T = FILM0 + tc;
                const c = camAt(tc);
                const cp = camAt(tc - 1 / 30);
                const cx = 260 * Math.sin((TAU * T) / 96);
                const cy = 70 * Math.sin((TAU * T) / 71 + 0.6);
                for (const L of lights) {
                  const px = L.x - cx * L.k + L.dx * Math.sin(TAU * L.f * T) - c.x * L.p;
                  const py = L.y - cy * L.k + L.dy * Math.cos(TAU * L.f * 0.8 * T) - c.y * L.p;
                  L.el.style.transform = `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px)`;
                }
                // the leaf shadows' parallax is slow enough that their 3200 px sheet still covers the frame at the end of
                // the 9,900 px world line (zero at 143 s, so the joint with the run is unchanged)
                const dx = -640 - cx * 0.3 + 26 * Math.sin(TAU * 0.09 * T) - c.x * 0.045;
                const dy = -360 - cy * 0.3 + 14 * Math.sin(TAU * 0.07 * T + 1) - c.y * 0.08;
                dapple.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
                // directional motion blur keyed to the camera's speed, on a container of its own (STYLE §5)
                const bx = Math.min(10, 0.2 * Math.abs(c.x - cp.x) * c.s);
                const by = Math.min(6, 0.2 * Math.abs(c.y - cp.y) * c.s);
                if (bx > 0.6 || by > 0.6) {
                  mblur.setAttribute("stdDeviation", `${bx.toFixed(2)} ${by.toFixed(2)}`);
                  world.style.filter = `url(#${cfg.id}-mblur)`;
                } else world.style.filter = "none";
                for (const o of Object.values(objs)) place(o, tc, T, c);
                const frame = Math.round(T * 30);
                const r = mulberry32(frame * 7919 + 13);
                const ox = Math.floor(r() * 256);
                const oy = Math.floor(r() * 256);
                gctx.setTransform(1, 0, 0, 1, -ox, -oy);
                gctx.fillStyle = patterns[frame % 4];
                gctx.fillRect(ox, oy, 960, 540);
                if (cfg.after) cfg.after(t, tc, c);
              }

              return { draw, toScreen, objs };
            }

            return { create, camAt, WORLD, wavePaths, mulberry32, E, prog, lerp, clamp01, bez, TAU, FILM0 };
          })();
          // rig:end
          const { E, prog, lerp, TAU, FILM0 } = CloseRig;
          const T0 = 11; // this composition's start in close time

          // synthetic.: 64 dots fly in from where they were scattered and gather into a ring (the opening's
          // metaphor, now in daylight ink), then breathe gently (0.6 Hz, never below 70%)
          const NS = "http://www.w3.org/2000/svg";
          const ring = document.getElementById("cl-ring");
          const rng = CloseRig.mulberry32(6464);
          const DOTS = Array.from({ length: 64 }, (_, i) => {
            const a = rng() * TAU;
            const r = 340 + rng() * 360;
            const el = document.createElementNS(NS, "circle");
            ring.appendChild(el);
            return {
              el,
              // scattered wide and low, so no dot crosses the keyword's box on its way in
              from: { x: 280 + r * Math.cos(a) * 1.3, y: 300 + r * Math.sin(a) * 0.4 },
              ang: -Math.PI / 2 + (i * TAU) / 64,
              delay: rng() * 0.32,
              ph: rng() * TAU,
            };
          });
          function drawDots(tc) {
            const T = FILM0 + tc;
            const turn = 0.035 * (tc - 16.3);
            for (const d of DOTS) {
              const u = E.p3o(prog(tc, 15.5 + d.delay, 16.3 + d.delay));
              const to = { x: 280 + 240 * Math.cos(d.ang + turn), y: 280 + 240 * Math.sin(d.ang + turn) };
              const x = lerp(d.from.x, to.x, u);
              const y = lerp(d.from.y, to.y, u);
              const rr = 8 * (0.85 + 0.15 * Math.sin(TAU * 0.6 * T + d.ph));
              d.el.setAttribute("cx", x.toFixed(1));
              d.el.setAttribute("cy", y.toFixed(1));
              d.el.setAttribute("r", rr.toFixed(2));
              d.el.setAttribute("opacity", (0.86 * prog(tc, 15.45 + d.delay, 15.75 + d.delay)).toFixed(3));
            }
          }
          // synthesized.: the statement's voice (shared with the end, so the joint at 21 s matches)
          const waveMain = document.getElementById("cl-waveMain");
          const waveEcho = document.getElementById("cl-waveEcho");
          function drawWave(tc) {
            if (tc < 19.0) return;
            const p = CloseRig.wavePaths(tc);
            waveMain.setAttribute("d", p.main);
            waveEcho.setAttribute("d", p.echo);
          }

          // the world (rig.js WORLD): the slip's close-up leaving, then the four limits' objects
          const rig = CloseRig.create({
            id: "cl",
            t0: T0,
            keys: ["slip", "peso", "dots", "fan", "read", "wave"],
            after: (_t, tc) => {
              drawDots(tc);
              drawWave(tc);
            },
          });
          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.to(clock, { t: 10, duration: 10, ease: "none", onUpdate: () => rig.draw(clock.t) }, 0);
          const at = (tc) => tc - T0; // close time -> local

          // one limit at a time, while it is said, each beside its object: a keyword (wipe in 0.75 s, out 0.32 s)
          // and its one tag. The sandbox tag holds from the frame the payout appears until it has gone.
          // (close time; the voice says "simulated" at 13.0, "Synthetic" 16.42, "replayed" 18.18, "Gemini" 19.56)
          const LIMITS = [
            { kw: [12.55, 14.4], tag: [11.0, 15.1] }, // PayPal is a simulated sandbox; no real farmer was paid
            { kw: [16.2, 17.6], tag: [16.25, 17.65] }, // Synthetic people and slips: the 64 members and the slip images
            { kw: [17.95, 19.12], tag: [17.95, 19.15] }, // a replayed stand-in
            { kw: [19.45, 20.6], tag: [19.5, 20.75] }, // Gemini TTS voices (wipe done 2 frames before the cut)
          ];
          LIMITS.forEach(({ kw, tag }, i) => {
            const n = i + 1;
            tl.fromTo(`#cl-kw${n} span`, { yPercent: 108 }, { yPercent: 0, duration: 0.75, ease: "expo.out" }, at(kw[0]));
            tl.to(`#cl-kw${n} span`, { yPercent: -108, duration: 0.32, ease: "power3.in" }, at(kw[1]));
            // the wipe fades over its first 0.16 s and its last 0.12 s (STYLE §5), so no descender tip (the y of
            // synthetic., synthesized.) is left in the mask for a frame
            tl.fromTo(`#cl-kw${n} span`, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, at(kw[0]));
            tl.to(`#cl-kw${n} span`, { opacity: 0, duration: 0.12, ease: "power1.in" }, at(kw[1]) + 0.2);
            tl.fromTo(
              `#cl-tag${n}`,
              { opacity: 0, x: 14 },
              { opacity: 1, x: 0, duration: i === 0 ? 0.35 : 0.4, ease: "power2.out" },
              at(tag[0]),
            );
            tl.to(`#cl-tag${n}`, { opacity: 0, duration: 0.2, ease: "power2.in" }, at(tag[1]));
          });

          // synthetic.: the count settles inside the ring once the dots have gathered
          tl.fromTo(
            "#cl-dotsFig",
            { opacity: 0, scale: 0.94, filter: "blur(12px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
            at(16.25),
          );
          // synthetic.: each slip image resolves out of a blur as the camera arrives (made in code, not photographed)
          ["#cl-fan .cl-fs1 .cl-fsImg", "#cl-fan .cl-fs2 .cl-fsImg", "#cl-fan .cl-fs3 .cl-fsImg"].forEach((sel, i) => {
            tl.fromTo(
              sel,
              { opacity: 0, filter: "blur(18px) saturate(0) brightness(1.25)" },
              { opacity: 1, filter: "blur(1.1px) saturate(0.5) brightness(1)", duration: 0.95, ease: "power2.out" },
              at(15.9 + 0.2 * i),
            );
          });
          // replayed.: the reading lifts out of the slips (STYLE §4 lift), and the slips go to the deep plane
          tl.fromTo(
            "#cl-readIn",
            { opacity: 0, scale: 0.55, y: 70, filter: "blur(14px)" },
            { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.75, ease: "expo.out" },
            at(17.75),
          );
          tl.fromTo(
            "#cl-fanIn",
            { opacity: 1, scale: 1, filter: "blur(0px) grayscale(0)" },
            { opacity: 0.5, scale: 0.85, filter: "blur(9px) grayscale(1)", duration: 0.8, ease: "power2.inOut" },
            at(17.75),
          );

          // the machine-translation chip arrives with the voices' keyword and stays on into the end's glide
          tl.fromTo("#cl-waveChip", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, at(19.6));

          rig.draw(0);
          window.__timelines["close-limits"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
