          <!-- D · none we found starts from a handwritten weigh-slip -->

        <svg id="imp-grain" viewBox="0 0 1920 1080" aria-hidden="true">
          <filter id="imp-noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" stitchTiles="stitch" />

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const qa = (s) => Array.from(document.querySelectorAll(s));

          function build() {
            // ---------- ambient: glows drift, camera breathes ----------
            tl.fromTo("#imp-glow-a", { x: 0, y: 0 }, { x: 160, y: -70, duration: 11, ease: "sine.inOut" }, 0);
            tl.fromTo("#imp-glow-b", { x: 0, y: 0 }, { x: -220, y: 40, duration: 11, ease: "sine.inOut" }, 0);
            tl.fromTo("#imp-cam", { scale: 1 }, { scale: 1.035, duration: 7.4, ease: "sine.inOut" }, 0);

            // ---------- A: 5,000+ tests (0.15-3.4) ----------
            tl.fromTo("#imp-hair", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.8, ease: "expo.inOut" }, 0.12);
            tl.to("#imp-hair", { opacity: 0, duration: 0.5, ease: "power1.out" }, 1.0);
            tl.fromTo("#imp-field-dim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.4);
            tl.fromTo("#imp-a", { "--p": "-10%" }, { "--p": "118%", duration: 2.2, ease: "power2.inOut" }, 0.5);
            tl.fromTo("#imp-a-veil", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.45);
            tl.fromTo("#imp-a-num", { yPercent: 105 }, { yPercent: 0, duration: 0.8, ease: "expo.out" }, 0.5);
            tl.fromTo(
              "#imp-a-line",
              { opacity: 0, x: -60 },
              { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" },
              1.0,
            );
            tl.fromTo("#imp-a-slab", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power4.out" }, 1.55);
            tl.fromTo("#imp-a-acc", { color: "#c3c9d6" }, { color: "#ffffff", duration: 0.2 }, 1.6);
            tl.fromTo("#imp-a-detail", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "sine.out" }, 2.0);
            // exit: the field folds into the centre; type lifts away
            tl.to(["#imp-a-num", "#imp-a-line", "#imp-a-detail"], { opacity: 0, y: -36, duration: 0.28, ease: "power2.in" }, 3.12);
            tl.to([".imp-field", "#imp-a-veil"], { scale: 0.18, opacity: 0, duration: 0.42, ease: "power3.in" }, 3.0);

            // ---------- B: 3 kill switches + labelled replays (3.4-5.45) ----------
            tl.fromTo("#imp-b-three", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 3.4);
            tl.fromTo("#imp-b-words", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 3.52);
            tl.fromTo("#imp-b-slab", { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "power4.out" }, 3.78);
            tl.fromTo("#imp-b-acc", { color: "#f4f6fa" }, { color: "#ffffff", duration: 0.2 }, 3.8);
            tl.fromTo(
              ".imp-sw",
              { opacity: 0, scale: 0.6 },
              { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)", stagger: 0.07 },
              3.48,
            );
            ["#imp-sw1", "#imp-sw2", "#imp-sw3"].forEach((sw, i) => {
              const at = 3.95 + i * 0.2;
              tl.fromTo(`${sw} .imp-knob`, { x: 96, backgroundColor: "#090d18" }, { x: 0, backgroundColor: "#8e98ae", duration: 0.34, ease: "power3.inOut" }, at);
              tl.fromTo(
                `${sw} .imp-track`,
                { backgroundColor: "rgba(244,246,250,1)", borderColor: "rgba(244,246,250,1)" },
                { backgroundColor: "rgba(244,246,250,0)", borderColor: "rgba(62,74,99,1)", duration: 0.3, ease: "power2.inOut" },
                at + 0.04,
              );
            });
            tl.fromTo("#imp-b-replay", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.5);
            tl.fromTo("#imp-b-loop", { rotation: -200 }, { rotation: 0, duration: 0.8, ease: "expo.out", transformOrigin: "50% 50%" }, 4.5);
            tl.to("#imp-b", { opacity: 0, scale: 0.97, duration: 0.26, ease: "power2.in" }, 5.26);

            // ---------- C: others we found share parts (5.45-7.6) ----------
            const far = [
              [-640, -250, 10, 40, -20, 18],
              [-170, -360, 200, -30, 20, -14],
              [690, 210, 160, -50, 10, 22],
              [-760, 160, 250, 30, 30, -12],
            ];
            const near = [
              [-430, 270, 120, 50, -24, 16],
              [300, 320, 300, -40, -16, -18],
              [560, -250, 60, 30, 26, 14],
              [140, -420, 20, -20, 30, 20],
              [-560, -40, 330, 26, -20, -16],
            ];
            const drift = (sel, list, delay) =>
              qa(sel).forEach((el, i) => {
                const [dx, dy, r, mx, my, mr] = list[i];
                tl.fromTo(
                  el,
                  { x: 960 + dx, y: 540 + dy, rotation: r, opacity: 0, transformOrigin: "50% 50%" },
                  { x: 960 + dx + mx, y: 540 + dy + my, rotation: r + mr, opacity: 1, duration: 2.5, ease: "sine.inOut" },
                  5.42 + delay + i * 0.06,
                );
              });
            drift(".imp-arc-f", far, 0);
            drift(".imp-arc-n", near, 0.1);
            tl.fromTo(
              "#imp-c-text span",
              { opacity: 0, y: 30, filter: "blur(10px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out", stagger: 0.09 },
              5.48,
            );
            tl.fromTo("#imp-c-detail", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.out" }, 6.1);
            tl.to(["#imp-c-text", "#imp-c-detail"], { opacity: 0, y: -24, duration: 0.24, ease: "power2.in" }, 7.38);
            tl.to("#imp-arcs-near", { opacity: 0, scale: 1.25, duration: 0.5, ease: "power2.in", transformOrigin: "50% 50%" }, 7.3);
            tl.to("#imp-arcs-far", { opacity: 0, scale: 1.15, duration: 0.6, ease: "power1.in", transformOrigin: "50% 50%" }, 7.3);

            // ---------- D: one kinetic line (7.6-11) ----------
            const words = qa("#imp-d-track .w");
            const lens = words.map((w) => w.textContent.trim().length + 1);
            const total = lens.reduce((a, b) => a + b, 0);
            let acc = 0;
            const T0 = 7.6;
            const RIDE = 1.85;
            const track = q("#imp-d-track");
            const measured = track.offsetWidth;
            const W = measured > 400 ? measured : 3340;
            const fit = Math.min(1, 1700 / W);
            tl.fromTo(
              track,
              { x: 820, xPercent: 0, yPercent: -50, scale: 1, transformOrigin: "50% 50%" },
              { x: 1300, xPercent: -100, duration: RIDE, ease: "none" },
              T0,
            );
            words.forEach((w, i) => {
              const at = T0 + RIDE * (acc / total) - 0.12;
              acc += lens[i];
              tl.fromTo(
                w,
                { opacity: 0, y: 46, filter: "blur(12px)" },
                { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.46, ease: "expo.out" },
                Math.max(T0 - 0.05, at),
              );
            });
            tl.fromTo("#imp-d-slab", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power4.out" }, 9.42);
            // camera pulls back until the whole sentence sits in frame
            tl.to(track, { x: 960, xPercent: -50, scale: fit, duration: 0.8, ease: "power3.inOut" }, 9.62);
            // the weigh-slip opens into daylight: black, then bright
            tl.fromTo("#imp-bloom", { scale: 0 }, { scale: 62, duration: 0.62, ease: "power2.in" }, 10.36);
            // the honesty tag takes its daylight colours with the bloom, ready for the limits card
            tl.fromTo(
              "#imp-sim",
              { backgroundColor: "rgba(16,23,42,0.6)", color: "#c3c9d6", borderColor: "#8996b4" },
              { backgroundColor: "rgba(255,255,255,0.7)", color: "#5a6476", borderColor: "#7e8898", duration: 0.3, ease: "power1.inOut" },
              10.68,
            );
          }

          Promise.all([
            document.fonts.load('690 116px "FS Sans"'),
            document.fonts.load('800 300px "FS Sans"'),
          ])
            .catch(() => null)
            .then(() => {
