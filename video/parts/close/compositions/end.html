      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          // ---------- ambient: the calmest light, a slow push, a branch in the breeze ----------
          tl.fromTo("#end-sun", { opacity: 0.55, scale: 0.92 }, { opacity: 1, scale: 1.04, duration: 8, ease: "sine.out" }, 0);
          // continues the limits card's wash from where it stopped; never far enough to bare the left edge
          tl.fromTo("#end-wash", { x: 70 }, { x: 78, duration: 8, ease: "sine.inOut" }, 0);
          tl.fromTo("#end-cam", { scale: 1 }, { scale: 1.035, duration: 8, ease: "sine.inOut" }, 0);
          tl.fromTo("#end-branch", { rotation: -1.2, x: 30 }, { rotation: 0.8, x: 0, duration: 8, ease: "sine.inOut" }, 0);

          // the branch draws itself in pencil
          tl.fromTo(".end-stem", { strokeDashoffset: 1.01 }, { strokeDashoffset: 0, duration: 2.2, ease: "power1.inOut" }, 0.3);
          tl.fromTo(".end-leaf", { strokeDashoffset: 1.01 }, { strokeDashoffset: 0, duration: 1.1, ease: "sine.inOut", stagger: 0.16 }, 0.7);
          tl.fromTo(".end-rib", { strokeDashoffset: 1.01 }, { strokeDashoffset: 0, duration: 0.8, ease: "sine.out", stagger: 0.1 }, 1.2);
          tl.fromTo(".end-leaf", { fillOpacity: 0 }, { fillOpacity: 1, duration: 1.4, ease: "sine.out" }, 2.0);

          // ---------- the trace: slip -> members -> buyer (0.15-4.3) ----------
          tl.fromTo(
            "#end-slip",
            { opacity: 0, y: 30, rotation: -10 },
            { opacity: 1, y: 0, rotation: -5, duration: 0.7, ease: "power3.out" },
            0.15,
          );
          tl.fromTo(".end-scr", { strokeDashoffset: 1.01 }, { strokeDashoffset: 0, duration: 0.45, ease: "power1.inOut", stagger: 0.14 }, 0.4);
          tl.fromTo(".end-label", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
          
          tl.fromTo(["#end-th1", "#end-th1g"], { strokeDashoffset: 1.01 }, { strokeDashoffset: 0, duration: 1.2, ease: "power1.inOut" }, 0.55);
          tl.fromTo("#end-n1", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 1.55);
          tl.fromTo("#end-k1", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)", transformOrigin: "50% 50%" }, 1.95);
          tl.fromTo(["#end-th2", "#end-th2g"], { strokeDashoffset: 1.01 }, { strokeDashoffset: 0, duration: 1.2, ease: "sine.inOut" }, 2.3);
          tl.fromTo("#end-n2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 3.3);
          tl.fromTo("#end-k2", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)", transformOrigin: "50% 50%" }, 3.7);
          const labels = document.querySelectorAll("#end-trace .end-label");
          tl.to(labels[0], { opacity: 1, duration: 0.4 }, 0.6);
          tl.to(labels[1], { opacity: 1, duration: 0.4 }, 1.75);
          tl.to(labels[2], { opacity: 1, duration: 0.4 }, 3.5);
          // the trace steps back into depth as the line is said
          tl.to("#end-trace", { opacity: 0.14, scale: 0.94, filter: "blur(4px)", duration: 0.7, ease: "power2.inOut", transformOrigin: "50% 45%" }, 4.3);
          // and leaves the end card clean before the name arrives
          tl.to("#end-trace", { opacity: 0, duration: 0.8, ease: "sine.inOut" }, 5.6);

          // ---------- "Every peso, traced." (4.65-6.6) ----------
          const words = document.querySelectorAll("#end-tag .w");
          [4.65, 5.1, 5.55].forEach((at, i) => {
            tl.fromTo(
              words[i],
              { opacity: 0, y: 60, filter: "blur(12px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.75, ease: "expo.out" },
              at,
            );
          });
          tl.fromTo("#end-ul path", { strokeDashoffset: 1.01 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 5.95);

          // ---------- the name (6.2-8) ----------
          // the tagline and the name travel together, so the name never lands on the tagline
          tl.fromTo("#end-mid", { y: 96 }, { y: 0, duration: 0.85, ease: "power3.inOut" }, 6.15);
          tl.fromTo(
            "#end-name",
            { opacity: 0, scale: 0.94 },
            { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" },
            6.4,
          );
          tl.fromTo("#end-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: "sine.out" }, 6.7);

          window.__timelines["close-end"] = tl;
        })();
