<script>
(() => {
  const tl = gsap.timeline({ paused: true });
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));
  const PE = (n) => gsap.parseEase(n);
  const E = {
    p2o: PE("power2.out"), p2i: PE("power2.in"), p2io: PE("power2.inOut"),
    p3o: PE("power3.out"), p3i: PE("power3.in"), p3io: PE("power3.inOut"),
    eo: PE("expo.out"), eio: PE("expo.inOut"), sio: PE("sine.inOut"), bo: PE("back.out(2.2)"), lin: (u) => u,
  };
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const prog = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, u) => a + (b - a) * u;
  function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const rnd = mulberry32(20261104);

  // ------------------------------------------------------------------ NIGHT geometry (screen px)
  const S = { x: 420, y: 470 };          // the glowing slip
  const P = { x: 770, y: 470 };          // where the line splits into 64 threads
  const W0 = { x: S.x + 64, y: S.y };    // where the line leaves the slip
  const RC = { x: 960, y: 500 }, RR = 300;
  const ARCS = [[560, 300, 13], [690, 325, 16], [820, 340, 17], [950, 352, 18]]; // rx, ry, count = 64
  const dots = [];
  ARCS.forEach(([rx, ry, n], k) => {
    for (let i = 0; i < n; i++) {
      const a = ((-70 + (140 * (i + 0.5)) / n + (rnd() - 0.5) * 3.2) * Math.PI) / 180;
      const r = 1 + (rnd() - 0.5) * 0.06;
      dots.push({ x: P.x + rx * r * Math.cos(a), y: P.y + ry * r * Math.sin(a), k, a });
    }
  });
  // bezier samples, fan order (centre first), ring targets
  const NS = 48;
  const bez = (p0, p1, p2, p3, u) => { const v = 1 - u; return { x: v*v*v*p0.x + 3*v*v*u*p1.x + 3*v*u*u*p2.x + u*u*u*p3.x, y: v*v*v*p0.y + 3*v*v*u*p1.y + 3*v*u*u*p2.y + u*u*u*p3.y }; };
  dots.forEach((d) => {
    const dx = d.x - P.x;
    d.c1 = { x: P.x + dx * 0.42, y: P.y };
    d.c2 = { x: P.x + dx * 0.58, y: d.y };
    d.pts = []; for (let i = 0; i <= NS; i++) d.pts.push(bez(P, d.c1, d.c2, d, i / NS));
  });
  const byAngle = dots.map((d, i) => i).sort((a, b) => Math.abs(dots[a].a) - Math.abs(dots[b].a));
  byAngle.forEach((idx, order) => { dots[idx].t0 = 6.2 + order * 0.0115 + dots[idx].k * 0.05; });
  dots.forEach((d) => { d.r0 = 11.35 + (3 - d.k) * 0.05 + rnd() * 0.08; });
  // the dots gather into a ring around their own centre (short, uncrossed paths), then the ring glides to centre
  const C0 = { x: dots.reduce((s, d) => s + d.x, 0) / 64, y: dots.reduce((s, d) => s + d.y, 0) / 64 };
  const ringOrder = dots.map((d, i) => i).sort((a, b) => Math.atan2(dots[a].y - C0.y, dots[a].x - C0.x) - Math.atan2(dots[b].y - C0.y, dots[b].x - C0.x));
  const th0 = Math.atan2(dots[ringOrder[0]].y - C0.y, dots[ringOrder[0]].x - C0.x);
  ringOrder.forEach((idx, j) => {
    dots[idx].th = th0 + (j * 2 * Math.PI) / 64;
    dots[idx].m0 = 11.78 + Math.abs(j - 32) * 0.004;
  });
  const GLIDE = [12.3, 13.0];
  function ringTarget(d, t) {
    const g = E.sio(prog(t, GLIDE[0], GLIDE[1]));
    const cx = lerp(C0.x, RC.x, g), cy = lerp(C0.y, RC.y, g), th = d.th + 0.5 * g;
    return { x: cx + RR * Math.cos(th), y: cy + RR * Math.sin(th) };
  }
